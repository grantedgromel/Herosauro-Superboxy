; Web is the reduced-fidelity preview tier: GL Compatibility / WebGL2, LDR
; framebuffer, no SSR/GI/volumetric fog/TAA/DOF. The 38 MB photogrammetry
; backdrop is excluded here — it would grow the pck roughly sixfold, and the
; backdrop scene skips instantiating it on Compatibility anyway.
[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; assets/ui/art/* is excluded because nothing loads it. The four banner and
; figure plates are referenced by no script, scene or resource — verified by
; grep across .gd/.tscn/.tres — so they are 9.2 MB of download that resolves to
; nothing on screen. They stay in the repo (they are source art, and half of
; them have a home the moment the set is complete); they just stop riding along
; in the tier where download size is the complaint.
exclude_filter="assets/models/backdrop/*,assets/ui/art/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; Threads are NOT an oversight and must not be flipped without also solving the
; header problem. Multithreaded WASM needs SharedArrayBuffer, SharedArrayBuffer
; needs cross-origin isolation (COOP: same-origin + COEP: require-corp), and
; GitHub Pages — where .github/workflows/web-export.yml publishes this build —
; sends neither and offers no way to set them. Turned on as-is, the export does
; not boot at all; that trades a slow load for a dead page.
;
; There IS a route: enable progressive_web_app and let its service worker inject
; the isolation headers (that is what the flag below it is for). It costs a
; second page load before the worker is live, and offline-caching a 16 MB pck.
; It is worth doing, but it is a deployment change that cannot be verified from
; a container with no browser and no Pages origin, so it is written down rather
; than guessed at. The load-time lever that does not need any of this is the
; world build itself: it runs in GDScript on the main thread, and on a
; single-threaded WASM build that IS the load screen.
variant/thread_support=false
vram_texture_compression/for_desktop=true
; Mobile texture formats are deliberately off. Shipping ETC2/ASTC alongside
; S3TC roughly doubles the compressed texture payload in the pck, and no mobile
; browser can play this: there is no touch input scheme in the input map, every
; action is keyboard, and the game is two players sharing one keyboard. Paying
; download size for a platform that cannot run the game is a straight loss.
; If a touch scheme ever lands, this flips with it — not before.
vram_texture_compression/for_mobile=false
