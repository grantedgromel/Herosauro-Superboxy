name: Web export

# Rebuilds the Godot HTML5 export from source and publishes it straight to the
# gh-pages branch, so the live preview always matches the latest .gd/.tscn.
#
# The build is NOT committed back to the source branch. It used to be, and that
# made every pull request conflict: main and the feature branch each regenerate
# a 16 MB index.pck, and git cannot merge binaries. gh-pages is force_orphan'd
# on each deploy, so the artifact lives in exactly one place and never enters
# the history being merged.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-export-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  PROJECT_DIR: herosauro-superboxy
  EXPORT_PRESET: "Web"

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless) + export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          wget -q "${BASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -O /tmp/godot.zip
          wget -q "${BASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" -O /tmp/templates.tpz

          unzip -o /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          unzip -o /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TEMPLATE_DIR/"

          godot --version

      - name: Import project resources
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # Headless import; can exit non-zero after importing, so don't fail the job here.
          timeout 300 godot --headless --import . || true

      - name: Export Web build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p web
          godot --headless --export-release "${EXPORT_PRESET}" web/index.html
          test -f web/index.pck && test -f web/index.wasm

      # CACHE-BUST THE BUILD, because a stale one is indistinguishable from a
      # broken one and the owner spent a session reporting bugs already fixed.
      # GitHub Pages serves the payload with ordinary caching and offers no way
      # to set headers, so the only fix is to change the URL every deploy.
      #
      # RENAME EVERY FILE THE LOADER DERIVES FROM `executable`, NOT JUST THE BIG
      # TWO. index.js maps them all in locateFile():
      #
      #     godot.audio.worklet.js           -> ${loadPath}.audio.worklet.js
      #     godot.audio.position.worklet.js  -> ${loadPath}.audio.position.worklet.js
      #     godot.js                         -> ${loadPath}.js
      #     godot.side.wasm                  -> ${loadPath}.side.wasm
      #     godot.wasm                       -> ${loadPath}.wasm
      #
      # The first version of this step renamed only .pck and .wasm and repointed
      # `executable`. The loader then asked for index.<sha>.audio.worklet.js,
      # which did not exist; AudioWorklet.addModule() rejected with AbortError;
      # and THE WEB BUILD SHIPPED WITH NO SOUND, plus an uncaught exception on
      # every animation frame because start_sample() keeps retrying against a
      # worklet that never came up. A cache-bust that silently kills audio is a
      # worse bug than the staleness it was fixing.
      #
      # The icons are deliberately left alone: index.html references those by
      # literal name in <link>/<meta>, not through loadPath.
      - name: Cache-bust the payload
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: |
          set -euo pipefail
          V="${GITHUB_SHA::12}"
          for ext in pck wasm side.wasm js audio.worklet.js audio.position.worklet.js; do
            if [ -f "index.${ext}" ]; then
              mv "index.${ext}" "index.${V}.${ext}"
              echo "renamed index.${ext} -> index.${V}.${ext}"
            fi
          done
          sed -i \
            -e "s|\"executable\":\"index\"|\"executable\":\"index.${V}\"|" \
            -e "s|\"index\.pck\"|\"index.${V}.pck\"|" \
            -e "s|\"index\.wasm\"|\"index.${V}.wasm\"|" \
            -e "s|src=\"index\.js\"|src=\"index.${V}.js\"|" \
            index.html

          # Fail the build rather than deploy a loader pointing at files that are
          # not there. Every path locateFile() can produce must exist on disk.
          grep -q "\"executable\":\"index.${V}\"" index.html
          grep -q "index.${V}.pck"  index.html
          grep -q "index.${V}.wasm" index.html
          grep -q "src=\"index.${V}.js\"" index.html
          for ext in pck wasm js audio.worklet.js audio.position.worklet.js; do
            test -f "index.${V}.${ext}" || { echo "::error::missing index.${V}.${ext}"; exit 1; }
          done
          echo "cache-busted to index.${V}.*"

      # Publish the build to gh-pages so the live GitHub Pages preview always
      # reflects the latest source. force_orphan keeps gh-pages a single commit
      # so the large wasm/pck don't bloat history. Pushing gh-pages does not
      # retrigger this workflow (it only runs on main / claude/**).
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ env.PROJECT_DIR }}/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy web build from ${{ github.sha }}"
